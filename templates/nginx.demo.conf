events {}
http {
  server {
    listen 8000;
    client_max_body_size 50m;
    add_header X-Insights-Local-Mode demo always;
    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $http_host;
      proxy_read_timeout 600s;
    }
  }
  server {
    listen 3000;
    client_max_body_size 50m;
    default_type application/json;
    add_header X-Insights-Local-Mode demo always;
    location ~ ^/api/auth/(login|logout|me)$ {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
    }
    location ~ ^/api/(analyze|chat|upload|auth)(/|$) {
      return 503 '{"detail":"Modo demonstracao: analises e integracoes externas desativadas."}';
    }
    location / {
      if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 503 '{"detail":"Modo demonstracao: operacao de escrita desativada."}';
      }
      proxy_pass http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 600s;
    }
  }
}
